<html><body><title>Market - Set Price</title>
<center>
<img src=L2UI.SquareGray width=300 height=1>
<br>
<img src="L2UI.SquareGray" width="300" height="1">
<table width=296 bgcolor=000000>
	<tr>
		<td width=1></td>
		<td width=53><font color=LEVEL>Set Price</font></td>
		<td width=240><font color=00FFFF>Enter the price for your item</font></td>
	</tr>
</table>
<img src="L2UI.SquareGray" width="300" height="1">
<table width=280>
	<tr>
		<td width=10 align=center><table bgcolor=FFFFFF cellpadding=6 cellspacing="-5"><tr><td><button width=32 height=32 back=L2UI_CH3.mainwndtabicon2 fore=L2UI_CH3.mainwndtabicon2></td></tr></table></td>
		<td width=100>Item: %itemname%</td>
		<td width=40>Quantity: %itemcount%</td>
	</tr>
</table>
<img src="L2UI.SquareGray" width=270 height=1><br1>
<table width=280 bgcolor="000000">
	<tr>
		<td width=100><font color=B09878>Price (Adena):</font></td>
		<td width=180><edit var="price" width=150></td>
	</tr>
	<tr>
		<td width=100><font color=B09878>Quantity:</font></td>
		<td width=180><edit var="quantity" width=150></td>
	</tr>
</table>
<img src="L2UI.SquareGray" width="280" height="1">
<table width=280 bgcolor="000000">
	<tr>
		<td width=140 align=center><button value="List Item" action="bypass -h _marketcreate %itemobjectid% $quantity $price" width=100 height=21 back="L2UI.DefaultButton_click" fore="L2UI.DefaultButton"></td>
		<td width=140 align=center><a action="bypass _marketsell">Cancel</a></td>
	</tr>
</table>
<img src="L2UI.SquareGray" width="300" height="1">
<font color=FF0000>Note: Items will be listed for 7 days. Commission: 5%</font>
</center>
</body></html>
