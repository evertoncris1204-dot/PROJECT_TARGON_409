# ============================================================
# DressMe System Configuration
# ============================================================

# Enable/Disable DressMe System
# Default: true
AllowDressMeSystem=true

# DressMe Command (voiced command to open the menu)
# Default: dressme
DressMeCommand=dressme

# Allow DressMe only for Premium players
# Default: false
AllowDressMeForPremiumOnly=false

# Allow DressMe in Olympiad
# Default: false
AllowDressMeInOly=false

# ============================================================
# Other Mods Configuration
# ============================================================

# Reward ID (if needed by other mods)
# Default: 3470
RewardId=3470

# Reward Count (if needed by other mods)
# Default: 10
RewardCount=10

# ============================================================
# Farm Dungeon Instance Configuration
# ============================================================

# Enable/Disable Farm Dungeon Instance System
# Default: false
AllowFarmDungeonInstance=true

# Farm Dungeon NPC ID
# Default: 35073
FarmDungeonNpcId=35073

# Farm Dungeon NPC Location (x,y,z)
# Default: 82727,148605,-3471
FarmDungeonNpcLocation=82727,148605,-3471

# Farm Dungeon Location (where players are teleported)
# Default: 105941,114730,-1560
FarmDungeonLocation=105941,114730,-1560

# Cost per hour (in adena)
# Default: 100000
FarmDungeonCostPerHour=100000

# Minimum duration in minutes
# Default: 30
FarmDungeonMinDuration=30

# Maximum duration in minutes
# Default: 120
FarmDungeonMaxDuration=120

# ============================================================
# Farm Dungeon Payment Item Configuration
# ============================================================

# Payment Item ID (use 57 for Adena, or any other item ID)
# Default: 57 (Adena)
FarmDungeonPaymentItemId=57

# Payment Item Count per Hour
# Default: 100000
FarmDungeonPaymentItemCountPerHour=100000

# ============================================================
# Farm Dungeon Monster Spawn Configuration
# ============================================================

# Monster Spawns (Format: npcId1,x1,y1,z1;npcId2,x2,y2,z2;...)
# Example: 20117,106679,116319,-1587;20117,106779,116419,-1587;20118,106579,116219,-1587
# Default: (empty - no monsters)
FarmDungeonMonsterSpawns=20117,106679,116319,-1587;20117,106779,116419,-1587;20118,106579,116219,-1587

# Monster Respawn Delay (in seconds)
# Default: 60
FarmDungeonMonsterRespawnDelay=60

# ============================================================
# Farm Dungeon Exit NPC Configuration
# ============================================================

# Exit NPC ID (NPC that allows players to leave the instance)
# Default: 35074
FarmDungeonExitNpcId=35074

