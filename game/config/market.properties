# =================================================================
#                          Market System
# =================================================================
#
# Configurações do sistema de Market/Auction
#

# Item usado como moeda no Market (padrão: 57 = Adena)
# Você pode mudar para qualquer outro item ID
MARKET_CURRENCY_ITEM_ID = 57

# Porcentagem de comissão cobrada nas vendas (padrão: 5%)
# Valor entre 0.0 e 1.0 (ex: 0.05 = 5%, 0.10 = 10%)
COMMISSION_RATE = 0.05

# Duração dos anúncios em dias (padrão: 7 dias)
LISTING_DURATION_DAYS = 7

# Número máximo de anúncios ativos por jogador (padrão: 10)
# Use 0 para desativar o limite
MAX_LISTINGS_PER_PLAYER = 10

# Ativar ou desativar o sistema de Market
ENABLED = True

# Permitir vender itens encantados (padrão: True)
ALLOW_ENCHANTED_ITEMS = True

# Permitir vender itens de quest (padrão: False)
ALLOW_QUEST_ITEMS = False

# Permitir vender itens equipados (padrão: False)
ALLOW_EQUIPPED_ITEMS = False

# Preço mínimo para listar um item (padrão: 1)
MIN_LISTING_PRICE = 1

# Preço máximo para listar um item (padrão: 0 = sem limite)
# Use 0 para desativar o limite máximo
MAX_LISTING_PRICE = 0

# Enviar anúncio global quando um item é listado (padrão: True)
SEND_GLOBAL_ANNOUNCEMENT = True

# Cor do anúncio global (padrão: FFFF00 = amarelo)
# Cores comuns: FFFF00 (amarelo), 00FF00 (verde), FF0000 (vermelho), 00FFFF (cyan)
ANNOUNCEMENT_COLOR = FFFF00

