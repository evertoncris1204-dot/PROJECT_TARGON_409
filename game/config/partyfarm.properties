#==================================================
#              Party Farm Event Configuration
#==================================================

# Enable or disable the Party Farm event
PartyFarmEnabled = true

# Event duration in minutes (after preparation time)
PartyFarmDuration = 1

# Preparation time in minutes (time between announcement and event start)
PartyFarmPreparation = 1

# Days of the week when the event can occur (0=Sunday, 1=Monday, ..., 6=Saturday)
# Separate multiple days with comma: 1,3,5 means Monday, Wednesday, Friday
PartyFarmDays = 1,2,5

# Event start times (24h format: HH:mm)
# Separate multiple times with comma: 10:30,15:00,17:20,21:15
PartyFarmTimes = 11:10,15:00,17:20,21:15,02:27

# Respawn configuration (in seconds)
# Respawn delay: Base time before mob respawns after death (0 = no respawn)
PartyFarmRespawnDelay = 5

# Respawn random: Random variation added/subtracted from respawn delay (in seconds)
# Example: Delay=60, Random=30 means respawn between 30-90 seconds
PartyFarmRespawnRandom = 1

