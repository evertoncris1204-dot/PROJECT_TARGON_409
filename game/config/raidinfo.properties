# =================================================================
#                          RaidInfo System
# =================================================================

# Enable or disable the RaidInfo System.
ENABLED = True

# Maximum number of Grand Bosses to display in the list. (0 for no limit)
MAX_GRAND_BOSSES_DISPLAY = 15

# Maximum number of Raid Bosses to display in the list. (0 for no limit)
MAX_RAID_BOSSES_DISPLAY = 15

# Maximum number of drops to display per boss. (0 for no limit)
MAX_DROPS_DISPLAY = 50

# List of Grand Boss NPC IDs to show in the RaidInfo.
# Format: Comma-separated list of NPC IDs (e.g., 29001,29014,29019)
# Leave empty to show all Grand Bosses.
GRAND_BOSS_IDS = 29001,29014,29019

# List of Raid Boss NPC IDs to show in the RaidInfo.
# Format: Comma-separated list of NPC IDs (e.g., 25319,25322,25325)
# Leave empty to show all Raid Bosses.
RAID_BOSS_IDS = 25319,25322,25325

# If true, only show bosses listed in GRAND_BOSS_IDS and RAID_BOSS_IDS.
# If false, show all bosses except those listed (whitelist vs blacklist).
USE_WHITELIST_MODE = True

